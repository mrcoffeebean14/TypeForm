# Render blueprint for the FastAPI backend with a persistent disk for SQLite.
# Deploy: push to GitHub, then "New +" -> "Blueprint" in the Render dashboard.
services:
  - type: web
    name: typeclone-backend
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: "pip install -r requirements.txt && python seed.py"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: DATABASE_URL
        value: sqlite:////var/data/app.db
      - key: CORS_ORIGINS
        # Replace with your deployed Vercel URL after the first deploy.
        value: https://your-frontend.vercel.app
      - key: PUBLIC_BASE_URL
        value: https://your-frontend.vercel.app
    disk:
      name: typeclone-data
      mountPath: /var/data
      sizeGB: 1
